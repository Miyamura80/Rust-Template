name: Release

# Cross-platform binary release for the `appctl` server/CLI.
#
# This is a functional baseline that builds `appctl` for each target and
# attaches archives to a GitHub Release. cargo-dist is adopted via
# `dist-workspace.toml`; running `dist init && dist generate ci` regenerates
# this file with the canonical cargo-dist pipeline (including the shell /
# PowerShell installers declared in that config).

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
      # Pre-releases (e.g. v1.3.0-beta.1) - the whole tag must match.
      - "v[0-9]+.[0-9]+.[0-9]+-*"

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: macos-latest
            target: x86_64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Install Rust
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master 2026-10-15
        with:
          toolchain: stable
          targets: ${{ matrix.target }}

      - name: Rust Cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Build appctl
        # `--locked` pins the exact Cargo.lock deps so the released binary can't
        # silently diverge from the tested dependency set.
        run: cargo build --locked --release -p appctl --target ${{ matrix.target }}

      - name: Package (unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          tar -czf "appctl-${{ matrix.target }}.tar.gz" \
            -C "target/${{ matrix.target }}/release" appctl

      - name: Package (windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Compress-Archive -Path "target/${{ matrix.target }}/release/appctl.exe" `
            -DestinationPath "appctl-${{ matrix.target }}.zip"

      - name: Publish to GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          # Mark semver pre-release tags (e.g. v1.3.0-beta.1) as pre-releases.
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: |
            appctl-*.tar.gz
            appctl-*.zip
