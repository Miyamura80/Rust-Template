name: Release

# Cross-platform binary release for the `appctl` server/CLI.
#
# This is a functional baseline that builds `appctl` for each target and
# attaches archives to a GitHub Release. cargo-dist is adopted via
# `dist-workspace.toml`; running `dist init && dist generate ci` regenerates
# this file with the canonical cargo-dist pipeline (including the shell /
# PowerShell installers declared in that config).

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: macos-latest
            target: x86_64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Build appctl
        run: cargo build --release -p appctl --target ${{ matrix.target }}

      - name: Package (unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          tar -czf "appctl-${{ matrix.target }}.tar.gz" \
            -C "target/${{ matrix.target }}/release" appctl

      - name: Package (windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Compress-Archive -Path "target/${{ matrix.target }}/release/appctl.exe" `
            -DestinationPath "appctl-${{ matrix.target }}.zip"

      - name: Publish to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            appctl-*.tar.gz
            appctl-*.zip
